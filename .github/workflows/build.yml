name: Godot 3D builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3

jobs:
  export:
    name: Export APK, EXE and Linux binary
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare export environment
        shell: bash
        run: |
          mkdir -p build/linux build/windows build/android /root/.android /root/.config/godot
          keytool -genkeypair -keystore /root/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 \
            -keyalg RSA -keysize 2048 -storetype JKS
          cat > /root/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
      - name: Import project resources
        run: godot --headless --editor --path . --quit
      - name: Export Linux binary
        run: godot --headless --path . --export-release "Linux" build/linux/PC-Creator-Simulator.x86_64
      - name: Export Windows executable
        run: godot --headless --path . --export-release "Windows" build/windows/PC-Creator-Simulator.exe
      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/android/PC-Creator-Simulator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim3d-linux
          path: build/linux/PC-Creator-Simulator.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim3d-windows
          path: build/windows/PC-Creator-Simulator.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim3d-android
          path: build/android/PC-Creator-Simulator.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
