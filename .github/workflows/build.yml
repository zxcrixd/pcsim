name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :composeApp:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim-android-apk
          path: composeApp/build/outputs/apk/**/*.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app image
        run: gradle :composeApp:createDistributable --no-daemon --stacktrace
      - name: Zip distribution
        shell: pwsh
        run: |
          Compress-Archive -Path "composeApp/build/compose/binaries/main/app/PCCreatorSimulator/*" -DestinationPath "pcsim-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim-windows-exe
          path: pcsim-windows.zip

  linux:
    name: Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app image
        run: gradle :composeApp:createDistributable --no-daemon --stacktrace
      - name: Zip distribution
        run: |
          cd composeApp/build/compose/binaries/main/app/PCCreatorSimulator
          zip -r "$GITHUB_WORKSPACE/pcsim-linux.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim-linux-binary
          path: pcsim-linux.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, windows, linux ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
