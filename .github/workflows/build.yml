name: Godot 3D builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: PC-Creator-Simulator

jobs:
  export:
    name: Export APK, EXE and Linux binary
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot templates and Android tools
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p build/linux build/windows build/android /root/.android
          keytool -genkeypair -keystore /root/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 \
            -keyalg RSA -keysize 2048 -storetype JKS || true
      - name: Import project resources
        run: godot --headless --verbose --editor --path . --quit
      - name: Export Linux binary
        run: godot --headless --verbose --path . --export-release "Linux" build/linux/${EXPORT_NAME}.x86_64
      - name: Export Windows executable
        run: godot --headless --verbose --path . --export-release "Windows" build/windows/${EXPORT_NAME}.exe
      - name: Export Android APK
        run: godot --headless --verbose --path . --export-debug "Android" build/android/${EXPORT_NAME}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim3d-linux
          path: build/linux/${{ env.EXPORT_NAME }}.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim3d-windows
          path: build/windows/${{ env.EXPORT_NAME }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pcsim3d-android
          path: build/android/${{ env.EXPORT_NAME }}.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
